<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concurso de disfraces</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>👻 Concurso de disfraces</h1>
    <p>DevCloud Academy · Halloween</p>
    <p id="aviso-demo" class="aviso" hidden>Modo demo: los datos viven solo en este navegador. Pega tus claves en config.js para conectar Supabase.</p>
  </header>

  <main>
    <!-- PASO 2: registrar (POST) | PASO 4: foto (archivos) -->
    <section class="panel">
      <h2>1. Entra al concurso</h2>
      <form id="form" novalidate>
        <label>Tu nombre
          <input id="nombre" maxlength="30" autocomplete="off" placeholder="Ana Torres">
        </label>
        <label>Tu disfraz
          <input id="disfraz" maxlength="30" autocomplete="off" placeholder="Vampiro elegante">
        </label>
        <label>Tu foto (opcional)
          <input id="foto" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
        <img id="vista" alt="Vista previa de tu foto" hidden>
        <button id="enviar" type="submit">Enviar al muro</button>
        <p id="msg" role="status"></p>
      </form>
    </section>

    <!-- PASO 1: ver participantes (GET) | PASO 5: votar -->
    <section class="panel">
      <h2>2. Vota por tu favorito</h2>
      <p class="nota">Tienes un solo voto.</p>
      <div id="muro" class="muro"></div>
    </section>

    <section class="panel">
      <h2>3. Ranking en vivo</h2>
      <div id="ranking"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    $("aviso-demo").hidden = !MODO_DEMO;

    function mostrar(texto, esError) {
      $("msg").textContent = texto;
      $("msg").className = esError ? "error" : "";
    }

    // Pedir la lista al servidor y dibujarla
    let ultimo = "";
    async function refrescar() {
      try {
        const lista = await db.listar();
        const huella = JSON.stringify(lista) + localStorage.getItem("mi_voto");
        if (huella === ultimo) return;
        ultimo = huella;
        pintarMuro($("muro"), lista, { miVoto: localStorage.getItem("mi_voto"), onVotar: votarPor });
        pintarRanking($("ranking"), lista);
      } catch (e) {
        mostrar(mensajeError(e), true);
      }
    }

    async function votarPor(id) {
      try {
        await votar(id);
        mostrar("¡Voto registrado!");
      } catch (e) {
        mostrar(mensajeError(e), true);
      }
      refrescar();
    }

    // Vista previa de la foto antes de enviar
    $("foto").onchange = async () => {
      const archivo = $("foto").files[0];
      $("vista").hidden = true;
      if (!archivo) return;
      try {
        const chica = await redimensionar(archivo);
        $("vista").src = URL.createObjectURL(chica);
        $("vista").hidden = false;
        mostrar("");
      } catch (e) {
        $("foto").value = "";
        mostrar(mensajeError(e), true);
      }
    };

    // Enviar el formulario
    $("form").onsubmit = async (ev) => {
      ev.preventDefault();
      const problema = validar($("nombre").value, $("disfraz").value);
      if (problema) return mostrar(problema, true);
      $("enviar").disabled = true;
      try {
        const archivo = $("foto").files[0];
        const foto = archivo ? await redimensionar(archivo) : null;
        await db.agregar({ nombre: $("nombre").value.trim(), disfraz: $("disfraz").value.trim(), foto });
        $("form").reset();
        $("vista").hidden = true;
        mostrar("¡Listo! Ya apareces en el muro 🎉");
        refrescar();
      } catch (e) {
        mostrar(mensajeError(e), true);
      } finally {
        $("enviar").disabled = false;
      }
    };

    $("nombre").oninput = $("disfraz").oninput = () => mostrar("");

    refrescar();
    db.suscribir(refrescar);
    setInterval(refrescar, 5000);
  </script>
</body>
</html>
